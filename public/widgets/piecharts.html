    <script>
      // Chart 0 - Simple

      let chart0 = new PieChart(document.getElementById("chart0"));
      chart0.push(new PieSection(10, "Colors!", "--text", "--background"));
      chart0.push(new PieSection(10, "Pie!", "teal", "currentColor"));
      chart0.push(new PieSection(10, "Css!", "--accent", "black"));

      chart0.presetStatic(); // Disable animations

      // Chart 1

      let chart1 = new PieChart(document.getElementById("chart1"));
      let sectionA = new PieSection(10, "Lorem", "teal");
      chart1.push(sectionA, false);
      let sectionB = new PieSection(20, "Ipsum", "crimson");
      sectionB.push(new PieSection(1, "I", "crimson"));
      sectionB.push(new PieSection(2, "P", "teal"));
      sectionB.push(new PieSection(1, "S", "crimson"));
      sectionB.push(new PieSection(1, "U", "crimson"));
      sectionB.push(new PieSection(1, "M", "crimson"));
      chart1.push(sectionB, false);
      let sectionC = new PieSection(30, "Dolor", "orange");
      sectionC.push(new PieSection(40, "Do", "crimson"));
      sectionC.push(new PieSection(60, "Lor", "teal"));
      chart1.push(sectionC, false);

      chart1.lineWidth = 10;
      chart1.holeRatio = 0.4;
      chart1.draw();

      // Chart 2

      let chart2 = new PieChart(document.getElementById("chart2"));
      chart2.holeRatio = 0.4;
      chart2.writePercentages = true;
      chart2.angleStartDeg = -90;
      chart2.angleEndDeg = 90;
      chart2.lineWidth = 10;
      let section0A = new PieSection(30, "Small", "crimson");
      let section0B = new PieSection(70, "Large", "teal");
      section0A.radiusFactor = .8;
      chart2.push(section0A);
      chart2.push(section0B);
      let section0AA = new PieSection(70, "Crust", "orange");
      section0AA.radiusFactor = .2;
      section0A.push(section0AA);
      chart2.draw();

      // Chart 2

      let chart3 = new PieChart(document.getElementById("chart3"));
      chart3.holeRatio = 0.4;
      chart3.writePercentages = true;
      for (let i = 0; i < 10; i++){
        let section = new PieSection(Math.random(), "");
        section.radiusFactor = 0.5 + section.value;
        chart3.push(section);
      }

      let chart = new PieChart(document.getElementById("chartTest"));
    </script>
