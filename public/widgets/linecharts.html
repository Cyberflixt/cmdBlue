    <script>
      // Plane 0 was preconfigured in html
      let plane0 = new CywidgetPlaneXY(document.getElementById("testPlaneXY0"));
      plane0.push(LineSeries.fromRandomSlope(10, 10, -.5, "currentColor"));
      plane0.drawAnimation(3000);


      let plane1 = new CywidgetPlaneXY(document.getElementById("testPlaneXY1"));

      plane1.push(LineSeries.fromRandomSlope(10, 10, -.5, "orange"));
      plane1.push(LineSeries.fromRandomSlope(10, 10, 10, "lime"));

      plane1.setHorizontalAxisText("Time");
      plane1.setVerticalAxisText("Amount");

      plane1.setHorizontalIncrement(1);

      plane1.drawAnimation(2000);
      plane1.insertSmoothCamera(10);



      let plane2 = new CywidgetPlaneXY(document.getElementById("testPlaneXY2"));

      let series2 = LineSeries.fromRandom(10, 10, "--accent");
      series2.drawPoints = true;
      plane2.push(series2);

      plane2.setHorizontalAxisText("Time");
      plane2.setVerticalAxisText("Amount");

      plane2.setHorizontalIncrement(1);
      plane2.usePreset_FixedChart();

      plane2.drawAnimation(2000);



      let plane3 = new CywidgetPlaneXY(document.getElementById("testPlaneXY3"));

      let series3 = LineSeries.fromRandom(10, 10, "crimson");
      series3.drawPoints = true;
      series3.customApplyContext = (ctx) => {
        ctx.setLineDash([10, 10]);
        ctx.lineWidth = 2;
      }
      series3.pointsRadius = 5;
      series3.drawPointAtPosition = (series, ctx, x, y, pointIndex) => {
        series.applyContext(ctx);
        ctx.beginPath();
        ctx.arc(x, y, series.pointsRadius, 0, 2 * Math.PI);
        ctx.fill();

        ctx.fillStyle = window.getComputedStyle(document.body).getPropertyValue('--background');
        ctx.beginPath();
        ctx.arc(x, y, series.pointsRadius * .5, 0, 2 * Math.PI);
        ctx.fill();
      }

      plane3.push(series3);

      plane3.setHorizontalAxisText("Time");
      plane3.setVerticalAxisText("Amount");

      plane3.setHorizontalIncrement(1);

      plane3.drawAnimation(2000);

      plane3.allowHorizontalZoom = false;
      plane3.allowHorizontalDragging = false;
    </script>
